name: freshness

# Once a month, compare the pinned protocol stack with the latest releases: the MCP spec, mcp,
# fastmcp and the conformance and inspector tools. A failed run lists the stale pins.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.23.4"
      - run: bash scripts/freshness.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
