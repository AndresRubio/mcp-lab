name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. A push to main gets a group of its own, so
# every merge commit gets a complete run: GitHub would otherwise drop a run still queued when the
# next merge lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.15"
      - run: uv sync --locked
      # Lint, format, types and the tests under `python -X dev`: the same command as locally.
      - run: ./scripts/check.sh
      # GitHub's Ubuntu runners ship shellcheck.
      - run: shellcheck scripts/*.sh

  ascii-locale:
    # The same check under a locale whose encoding is ASCII. In every job, check.sh's
    # `-X warn_default_encoding` fails each text read or write without an explicit encoding,
    # whatever the data. This job adds the locale: a read or write without an encoding that handles
    # non-ASCII data fails here too, including in child processes the flag does not reach. ASCII
    # data passes under this locale. PYTHONUTF8=0 and PYTHONCOERCECLOCALE=0 stop Python from
    # quietly switching the C locale back to UTF-8.
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      PYTHONUTF8: "0"
      PYTHONCOERCECLOCALE: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.15"
      - run: uv sync --locked
      - run: ./scripts/check.sh

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.15"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.23.4"
      - run: uv sync --locked
      - run: ./scripts/conformance.sh
      - run: ./scripts/inspector-smoke.sh
