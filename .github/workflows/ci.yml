name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      # Lint, format, types and the tests under `python -X dev`: the same command as locally.
      - run: ./scripts/check.sh

  ascii-locale:
    # The same check under a locale whose encoding is ASCII, so a file read or written without an
    # explicit encoding fails here instead of on an operator's machine. PYTHONUTF8=0 and
    # PYTHONCOERCECLOCALE=0 stop Python from quietly switching the C locale back to UTF-8.
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      PYTHONUTF8: "0"
      PYTHONCOERCECLOCALE: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: ./scripts/check.sh

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: ./scripts/conformance.sh
      - run: ./scripts/inspector-smoke.sh
