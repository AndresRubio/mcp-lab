[project]
name = "opsdesk-server"
version = "0.1.0"
description = "OpsDesk: a reference MCP server for the 2026-07-28 spec"
requires-python = ">=3.13"
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[project.scripts]
opsdesk-server = "opsdesk.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opsdesk"
